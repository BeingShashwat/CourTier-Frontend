<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cour {
        font-family: Inter, Geist, "Plus Jakarta Sans", Arial, sans-serif;
        font-size: 170px;
        font-weight: 400;
        letter-spacing: 0.03em;
        fill: #1A2744;
      }

      .tier {
        font-family: Inter, Geist, "Plus Jakarta Sans", Arial, sans-serif;
        font-size: 180px;
        font-weight: 700;
        letter-spacing: 0.03em;
        fill: #E8A020;
      }
    </style>
  </defs>

  <!-- ICON -->
  <g transform="translate(40,35)">
    
    <!-- Top balance beam -->
    <rect x="40" y="15"
          width="190" height="16"
          rx="8"
          fill="#E8A020"/>

    <!-- Lower balance beam -->
    <rect x="32" y="65"
          width="206" height="16"
          rx="8"
          fill="#1A2744"/>

    <!-- Vertical stem -->
    <rect x="128" y="78"
          width="14" height="112"
          rx="7"
          fill="#1A2744"/>

    <!-- Notification / scale arc -->
    <path d="M42 168
             C86 218 184 218 228 168"
          stroke="#1A2744"
          stroke-width="12"
          stroke-linecap="round"
          fill="none"/>

    <!-- Outer pulse accents -->
    <path d="M18 176
             C24 188 31 198 42 208"
          stroke="#1A2744"
          stroke-width="10"
          stroke-linecap="round"
          fill="none"/>

    <path d="M252 176
             C246 188 239 198 228 208"
          stroke="#1A2744"
          stroke-width="10"
          stroke-linecap="round"
          fill="none"/>
  </g>

  <!-- WORDMARK -->
  <text x="350" y="215" class="cour">Cour</text>
  <text x="760" y="220" class="tier">Tier</text>

</svg>