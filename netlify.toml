# ==============================================================================
# CourTier — Netlify Production Deployment Configuration (netlify.toml)
# ==============================================================================

[build]
  # Target directory where Vite compiles production bundles
  # Standalone: "dist" | Monorepo: "frontend/dist"
  publish = "dist"
  
  # Command to compile and minify the React SPA assets
  command = "npm run build"

  # Optional: Define base directory if deployed directly from monorepo root
  # base = "frontend"

# ─── Custom Response Headers (Security Hardening) ────────────────────────────
[[headers]]
  for = "/*"
    [headers.values]
      # Prevent Clickjacking attacks
      X-Frame-Options = "DENY"
      
      # Prevent MIME type sniffing
      X-Content-Type-Options = "nosniff"
      
      # Block pages from loading when reflected XSS is detected
      X-XSS-Protection = "1; mode=block"
      
      # Control referrer leakage
      Referrer-Policy = "strict-origin-when-cross-origin"
      
      # Enforce strict transport security (HTTPS) for 1 year (include subdomains)
      Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
      
      # Content Security Policy (Adjust domains if loading resources externally)
      Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://api.courtier.in http://localhost:8080 http://34.14.217.158;"

# Cache-Control overrides for immutable static assets
[[headers]]
  for = "/assets/*"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

# ─── Routing Redirects and Rewrites ──────────────────────────────────────────

# OPTIONAL: Proxy API traffic to EC2 Nginx gateway if CORS is not used.
# Uncomment and update the 'to' path with your EC2 API server endpoint.
[[redirects]]
  from = "/api/*"
  to = "http://34.14.217.158/api/:splat"
  status = 200
  force = true

# FALLBACK RULE: Redirect all client-side paths to index.html for SPA React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
